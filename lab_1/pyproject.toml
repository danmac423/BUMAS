[project]
name = "lab_1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "kornia>=0.9.0",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "tabulate>=0.10.0",
    "torch>=2.11.0",
    "tqdm>=4.70.1",
]

[project.scripts]
lab_1 = "lab_1.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
