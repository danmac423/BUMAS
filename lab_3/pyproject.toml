[project]
name = "lab_3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "torch>=2.8",
    "tqdm>=4.66",
    "transformers>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
target-version = "py313"
line-length = 120
# Supplied with the task and kept unchanged.
extend-exclude = ["src/lab_3/model/openbumas.py", "src/lab_3/model/MODEL_CARD.md"]
force-exclude = true

[tool.ty.src]
exclude = ["src/lab_3/model/openbumas.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]

[tool.uv.sources]
# CUDA wheels everywhere except macOS, where the default PyPI wheel (with MPS) is used.
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
